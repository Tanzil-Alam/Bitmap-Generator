<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>My Converter — Bitmap Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="dithering.js" defer></script>
  <script src="script.js" defer></script>
</head>

<body>

  <main class="app-shell">
    <section class="intro" aria-labelledby="page-title">
      <H1>Your image is now on OLED</H1>
    </section>

    <section class="workspace" aria-label="Bitmap generator">
      <section class="card upload-card" aria-labelledby="upload-title">
        <div class="card-heading">
          <div>
          </div>
        </div>

        <input type="file" id="file-input" accept="image/*">
        <label class="file-picker" for="file-input">
          <span class="upload-icon" aria-hidden="true">↑</span>
          <span class="file-picker-copy">
            <strong>select an image</strong>
            <span>It accepts colorfull image and convert to black and white, but try to give black and white image if
              you can</span>
          </span>
          <span class="browse-button">Choose file</span>
        </label>
        <p id="selected-file" class="selected-file" aria-live="polite">No image selected</p>
        <p id="only-images-file-error" class="message error" role="alert"></p>
      </section>

      <aside class="card preview-card" aria-labelledby="preview-title">
        <div class="preview-heading">
          <div>
            <p class="eyebrow">Live preview</p>
            <h2 id="preview-title">128 x 64</h2>
          </div>
        </div>
        <div class="preview-frame">
          <div id="preview-placeholder" class="preview-placeholder">
          </div>
          <div id="images-canvas-container" class="preview-canvas-container"></div>
        </div>
      </aside>

      <section class="card output-card" aria-labelledby="output-title">
        <div class="card-heading">
          <div>
            <h2 id="output-title">Generate Arduino code</h2>
          </div>
        </div>

        <div class="output-actions">
          <button type="button" id="generate-button" class="button button-primary" disabled>
            Generate code
          </button>
          <button type="button" id="copy-button" class="button button-secondary" disabled>
            <span aria-hidden="true">▢</span> Copy code
          </button>
          <div class="format-buttons" role="group" aria-label="Code format">
            <button type="button" class="format-button is-selected" data-format="arduino"
              aria-pressed="true">Arduino</button>
            <button type="button" class="format-button" data-format="esp8266" aria-pressed="false">Esp8266</button>
            <button type="button" class="format-button" data-format="esp32" aria-pressed="false">Esp32</button>
          </div>
        </div>

        <textarea id="code-output" class="code-output" aria-label="Generated Arduino code" spellcheck="false"
          readonly></textarea>
        <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
      </section>
  </main>
</body>

</html
